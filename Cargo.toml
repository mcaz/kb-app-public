[workspace]
resolver = "2"
members = ["crates/kb-core", "crates/kb-cli", "app/src-tauri"]
exclude = ["poc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
