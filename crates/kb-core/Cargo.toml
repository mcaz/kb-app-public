[package]
name = "kb-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# GUI(Tauri)向けに TS 型を生成するときだけ有効化する。CLI には持ち込まない。
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
lindera = { version = "5.0.2", features = ["embed-ipadic"] }
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "ndarray"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
ndarray = "0.17"
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
# Artifact の content_hash(ADR-0003 決定2: Git LFS の OID と同じ SHA-256 に揃える)
sha2 = "0.10"
rand = "0.9"
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
dirs = "6"
fs4 = { version = "0.13", features = ["sync"] }
ureq = "3.4"
tempfile = "3"
base64 = "0.22"
# OAuth token はファイルへ保存せず、macOS Keychain / Windows Credential Manager /
# Linux Secret Service へ預ける。v1 API は各 OS の推奨 credential store を選ぶ。
keyring = "4.1"

[dev-dependencies]
