[package]
name = "kb-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "kb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
kb-core = { path = "../../crates/kb-core", features = ["specta"] }
# TS 型と invoke ラッパの生成(app/src/lib/bindings.ts)。手書きの型合わせを廃止する
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
encoding_rs = "0.8"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
tempfile = "3"
