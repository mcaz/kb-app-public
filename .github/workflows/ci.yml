name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: フロント(整形・lint・型・テスト・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    name: コア(fmt・clippy・テスト・型生成の追従)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri(kb-app)のビルドに必要な GTK/WebKit まわり
      - name: システム依存を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev libxdo-dev patchelf
      # 同期のテストは `git pull --rebase` を通る(rebase はコミットを作るので
      # 識別子が要る)。開発機では個人の設定が効いているため気づけない
      - name: git の識別子を設定
        run: |
          git config --global user.email "ci@kb-app.invalid"
          git config --global user.name "kb-app CI"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # bindings.ts は Rust が正本。コアを変えて生成し忘れたらここで落ちる(ADR-0002)
      - name: 生成した TS 型に差分が無いこと
        run: git diff --exit-code -- app/src/lib/bindings.ts
